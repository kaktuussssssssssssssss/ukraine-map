<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Інтерактивна карта України — демонстраційний симулятор." />
  <title>Мапа України — симулятор</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◈</span><div><strong id="appTitle">Мапа України</strong><small id="appSub">Інтерактивний симулятор</small></div></div>
      <div class="header-actions">
        <span class="sim-badge" id="simBadge">СИМУЛЯЦІЯ · НЕ РЕАЛЬНІ ТРИВОГИ</span>
        <button type="button" class="language" id="langBtn" aria-label="Змінити мову">УКР <span aria-hidden="true">⌄</span></button>
      </div>
    </header>
    <section class="map-wrap" aria-label="Карта України">
      <div id="map"></div>
      <aside class="district-panel" aria-label="Райони України">
        <div class="panel-heading"><div><strong id="districtsTitle">Райони України</strong><small id="districtsSubtitle">Оберіть район на мапі або знайдіть його</small></div><button id="panelToggle" aria-label="Згорнути панель" title="Згорнути панель">−</button></div>
        <div class="panel-body" id="panelBody">
          <label class="sr-only" for="districtSearch">Пошук району</label>
          <input id="districtSearch" type="search" placeholder="Пошук району…" autocomplete="off" />
          <div id="districtLoading" class="district-loading" role="status">Завантаження меж районів…</div>
          <div id="districtResults" class="district-results"></div>
          <div id="selectedDistrict" class="selected-district" hidden><small id="selectedCaption">Обраний район</small><strong id="selectedName"></strong><span id="selectedExtra"></span><button id="deselectBtn" type="button">Скасувати вибір</button></div>
          <div class="data-note" id="dataNote">Межі: адміністративний поділ 2020 · Геодані CC BY 4.0</div>
        </div>
      </aside>
      <div class="floating-controls">
        <button id="homeBtn" title="Показати всю Україну" aria-label="Показати всю Україну">⌂</button>
        <button id="fullscreenBtn" title="На весь екран" aria-label="На весь екран">⛶</button>
      </div>
      <div class="bottom-info"><span class="status-dot"></span><span id="mapStatus">Карта активна</span><span class="sep">·</span><span id="stageLabel">Етап 1.0</span></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
